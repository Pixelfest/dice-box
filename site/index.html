            if (angle === 180) return { x: -sx, y: -sy };
            return { x: sx, y: sy };
        }

        function markSensorLive(sourceLabel) {
            sensorEventsReceived++;
            sensorStatusLabel.textContent = sourceLabel;
            sensorLed.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
            topSensorDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
            motionBtnText.textContent = 'Recalibrate Flat Center';
        }

        function wakeUnlockedDiceOnTilt(nx, ny, nz) {
            const delta = Math.hypot(nx - smoothTilt.nx, ny - smoothTilt.ny, nz - smoothTilt.nz);
            if (delta > 0.04) {
                diceList.forEach(d => {
                    if (!d.locked) d.body.wakeUp();
                });
            }
        }

        function applyGravityFromTilt(nx, ny, nz) {
            const clampedX = THREE.MathUtils.clamp(nx, -1, 1);
            const clampedY = THREE.MathUtils.clamp(ny, -1, 1);
            const clampedZ = THREE.MathUtils.clamp(nz, -1, 1);
            wakeUnlockedDiceOnTilt(clampedX, clampedY, clampedZ);
            targetTilt.nx = clampedX;
            targetTilt.ny = clampedY;
            targetTilt.nz = clampedZ;
        }

        function handleOrientationEvent(e) {
            if (e.beta === null && e.gamma === null) return;

            lastOrientationEventTime = performance.now();
            const betaRad = THREE.MathUtils.degToRad(e.beta || 0);   // front-to-back [-180..180]
            const gammaRad = THREE.MathUtils.degToRad(e.gamma || 0); // left-to-right [-90..90]

            // Compute 3D gravity vector from phone orientation angles
            const rawX = Math.sin(gammaRad) * Math.cos(betaRad);
            const rawY = Math.sin(betaRad);
            const rawZ = -Math.cos(betaRad) * Math.cos(gammaRad);

            const scr = rotateSensorXYToScreen(rawX, rawY);
            latestRawSensor = { nx: scr.x, ny: rawZ, nz: scr.y };

            if (!manualPadOverride) {
                markSensorLive('ORIENTATION LIVE');
                // Amplify tilt sensitivity slightly (1.25x) so gentle phone tilts roll dice smoothly
                const adjX = (scr.x - calibrationOffset.nx) * 1.25;
                const adjZ = (scr.y - calibrationOffset.nz) * 1.25;
                applyGravityFromTilt(adjX, rawZ, adjZ);
            }
        }

        function handleMotionEvent(e) {
            const accG = e.accelerationIncludingGravity;
            if (!accG || (accG.x === null && accG.y === null)) return;

            // Use accelerometer for gravity if deviceorientation isn't actively firing
            const now = performance.now();
            if (now - lastOrientationEventTime > 250) {
                // On Android & iOS, tilting right gives negative accG.x, tilting forward towards user gives positive accG.y
                const scr = rotateSensorXYToScreen(-accG.x / 9.81, accG.y / 9.81);
                const ny = THREE.MathUtils.clamp(-(accG.z || 9.81) / 9.81, -1, 1);
                latestRawSensor = { nx: scr.x, ny, nz: scr.y };

                if (!manualPadOverride) {
                    markSensorLive('ACCEL GRAVITY LIVE');
                    const adjX = (scr.x - calibrationOffset.nx) * 1.25;
                    const adjZ = (scr.y - calibrationOffset.nz) * 1.25;
                    applyGravityFromTilt(adjX, ny, adjZ);
                }
            }

            // Linear shake detection
            const ax = accG.x || 0;
            const ay = accG.y || 0;
            const az = accG.z || 0;
            const dx = ax - prevAccel.x;
            const dy = ay - prevAccel.y;
            const dz = az - prevAccel.z;
            prevAccel = { x: ax, y: ay, z: az };

            const deltaMag = Math.hypot(dx, dy, dz);
            if (deltaMag > 13.5 && now - lastShakeTimestamp > 240) {
                lastShakeTimestamp = now;
                const dirX = THREE.MathUtils.clamp(-dx / 15, -1.2, 1.2);
                const dirZ = THREE.MathUtils.clamp(dy / 15, -1.2, 1.2);
                applyRollToUnlockedDice(dirX, dirZ, Math.min(1.75, deltaMag / 14));
            }
        }

        function attachAllSensorListeners() {
            if (listenersAttached) return;
            listenersAttached = true;

            window.addEventListener('deviceorientation', handleOrientationEvent, true);
            window.addEventListener('deviceorientationabsolute', handleOrientationEvent, true);
            window.addEventListener('devicemotion', handleMotionEvent, true);

            // Also try Chrome Android Generic Sensor API (Accelerometer / GravitySensor) if available
            try {
                if ('GravitySensor' in window) {
                    const gravSensor = new window.GravitySensor({ frequency: 60 });
                    gravSensor.addEventListener('reading', () => {
                        if ( performance.now() - lastOrientationEventTime > 250 && !manualPadOverride) {
                            const scr = rotateSensorXYToScreen(-gravSensor.x / 9.81, gravSensor.y / 9.81);
                            const ny = THREE.MathUtils.clamp(-gravSensor.z / 9.81, -1, 1);
                            latestRawSensor = { nx: scr.x, ny, nz: scr.y };
                            markSensorLive('GRAVITY SENSOR LIVE');
                            applyGravityFromTilt(
                                (scr.x - calibrationOffset.nx) * 1.25,
                                ny,
                                (scr.y - calibrationOffset.nz) * 1.25
                            );
                        }
                    });
                    gravSensor.start();
                } else if ('Accelerometer' in window) {
                    const accelSensor = new window.Accelerometer({ frequency: 60 });
                    accelSensor.addEventListener('reading', () => {
                        if (performance.now() - lastOrientationEventTime > 250 && !manualPadOverride) {
                            const scr = rotateSensorXYToScreen(-accelSensor.x / 9.81, accelSensor.y / 9.81);
                            const ny = THREE.MathUtils.clamp(-accelSensor.z / 9.81, -1, 1);
                            latestRawSensor = { nx: scr.x, ny, nz: scr.y };
                            markSensorLive('ACCELEROMETER LIVE');
                            applyGravityFromTilt(
                                (scr.x - calibrationOffset.nx) * 1.25,
                                ny,
                                (scr.y - calibrationOffset.nz) * 1.25
                            );
                        }
                    });
                    accelSensor.start();
                }
            } catch (sensorErr) {
                // Generic Sensor API blocked by Permissions-Policy or unsupported; standard events remain active
            }
        }

        // Attach immediately on load for Android / standard browsers
        attachAllSensorListeners();

        function calibrateCurrentAngleAsZero() {
            manualPadOverride = false;
            calibrationOffset.nx = latestRawSensor.nx;
            calibrationOffset.nz = latestRawSensor.nz;
            applyGravityFromTilt(0, latestRawSensor.ny || -1, 0);
            sensorDiagMsg.textContent = 'Calibrated! Current phone angle set as flat center.';
            sensorDiagMsg.className = 'text-[10px] text-emerald-400 mt-1.5 leading-snug text-center font-semibold';
        }

        // Universal "Enable / Calibrate Phone Tilt" button handler (works on both iOS and Android/Desktop)
        motionBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            soundFX.init();
            manualPadOverride = false;

            let iosPermissionGranted = true;
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const res1 = await DeviceOrientationEvent.requestPermission();
                    iosPermissionGranted = (res1 === 'granted');
                }
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    const res2 = await DeviceMotionEvent.requestPermission();
                    iosPermissionGranted = iosPermissionGranted || (res2 === 'granted');
                }
            } catch (err) {
                console.warn('Permission request error:', err);
            }

            attachAllSensorListeners();

            const initialCount = sensorEventsReceived;
            sensorDiagMsg.textContent = 'Checking device motion & orientation sensors...';
            sensorDiagMsg.className = 'text-[10px] text-amber-300 mt-1.5 leading-snug text-center';

            setTimeout(() => {
                if (sensorEventsReceived > initialCount || sensorEventsReceived > 0) {
                    calibrateCurrentAngleAsZero();
                    applyRollToUnlockedDice(0.25, -0.25, 0.7);
                } else if (!iosPermissionGranted) {
                    sensorDiagMsg.textContent = 'Permission denied. Please allow Motion & Orientation access in browser settings.';
                    sensorDiagMsg.className = 'text-[10px] text-red-400 mt-1.5 leading-snug text-center';
                } else {
                    sensorDiagMsg.textContent = 'No hardware tilt events detected (browser/iframe may block sensors on non-HTTPS or desktop). Use the 3D Tilt Pad below!';
                    sensorDiagMsg.className = 'text-[10px] text-amber-300 mt-1.5 leading-snug text-center';
                }
            }, 350);
        });

        calibrateZeroBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundFX.init();
            calibrateCurrentAngleAsZero();
        });

        // Desktop & Touch Interactive Gravity Tilt Pad
        let padPointerId = null;
        function updateTiltFromPadEvent(e) {
            const rect = tiltPad.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const maxR = rect.width / 2 - 4;
            const nx = THREE.MathUtils.clamp((e.clientX - cx) / maxR, -1, 1);
            const nz = THREE.MathUtils.clamp((e.clientY - cy) / maxR, -1, 1);

            manualPadOverride = true;
            sensorStatusLabel.textContent = 'MANUAL TILT PAD';
            sensorLed.className = 'w-2 h-2 rounded-full bg-amber-400';
            topSensorDot.className = 'w-2 h-2 rounded-full bg-amber-400';
            applyGravityFromTilt(nx, targetTilt.ny, nz);
        }

        tiltPad.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            soundFX.init();
            padPointerId = e.pointerId;
            tiltPad.setPointerCapture(e.pointerId);
            updateTiltFromPadEvent(e);
        });
        tiltPad.addEventListener('pointermove', (e) => {
            if (e.pointerId !== padPointerId) return;
            updateTiltFromPadEvent(e);
        });
        tiltPad.addEventListener('pointerup', (e) => {
            if (e.pointerId !== padPointerId) return;
            padPointerId = null;
        });

        flipZBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundFX.init();
            manualPadOverride = true;
            const newNy = targetTilt.ny < 0 ? 1 : -1;
            applyGravityFromTilt(targetTilt.nx, newNy, targetTilt.nz);
            flipZBtn.classList.toggle('bg-amber-500', newNy > 0);
            flipZBtn.classList.toggle('text-slate-950', newNy > 0);
        });

        resetTiltBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            manualPadOverride = false;
            calibrationOffset = { nx: 0, nz: 0 };
            sensorStatusLabel.textContent = sensorEventsReceived > 0 ? 'ORIENTATION LIVE' : 'FLAT GRAVITY';
            applyGravityFromTilt(0, -1, 0);
            flipZBtn.classList.remove('bg-amber-500', 'text-slate-950');
        });

        /**************************************************************
         * 11. POPUP MENUS, HUD SCORE & POLYHEDRAL SPAWNER
         **************************************************************/
        const readoutListEl = document.getElementById('dice-readout-list');
        const totalSumEl = document.getElementById('total-sum-badge');
        const diceCountLabel = document.getElementById('dice-count-label');
        const unlockBtn = document.getElementById('unlock-btn');
        const rollBtn = document.getElementById('roll-btn');

        const openDiceMenuBtn = document.getElementById('open-dice-menu-btn');
        const closeDiceMenuBtn = document.getElementById('close-dice-menu-btn');
        const openTiltMenuBtn = document.getElementById('open-tilt-menu-btn');
        const closeTiltMenuBtn = document.getElementById('close-tilt-menu-btn');

        /**
         * Settings panel. Each entry ties a slider to a physics value. Values are remembered per device in
         * localStorage; that can be unavailable (private mode, blocked storage), so the panel still works
         * without it and just starts from the defaults.
         */
        const SETTINGS_STORAGE_KEY = 'dice-box-settings';
        const SETTINGS = {
            floorFriction: {
                defaultValue: 0.55,
                slider: document.getElementById('floor-friction-slider'),
                label: document.getElementById('floor-friction-value'),
                apply: (v) => { diceFloorContact.friction = v; }
            },
            diceFriction: {
                defaultValue: 0.25,
                slider: document.getElementById('dice-friction-slider'),
                label: document.getElementById('dice-friction-value'),
                apply: (v) => { diceDiceContact.friction = v; }
            }
        };

        function loadStoredSettings() {
            try {
                return JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY)) || {};
            } catch {
                return {};
            }
        }

        function saveSettings() {
            const values = {};
            Object.entries(SETTINGS).forEach(([key, s]) => { values[key] = Number(s.slider.value); });
            try {
                localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(values));
            } catch {
                // Storage unavailable: the setting still applies for this session.
            }
        }

        function setSetting(key, value) {
            const s = SETTINGS[key];
            const min = Number(s.slider.min);
            const max = Number(s.slider.max);
            const v = Number.isFinite(value) ? Math.min(max, Math.max(min, value)) : s.defaultValue;
            s.slider.value = v;
            s.label.textContent = v.toFixed(2);
            s.apply(v);
        }

        const storedSettings = loadStoredSettings();
        Object.entries(SETTINGS).forEach(([key, s]) => {
            setSetting(key, key in storedSettings ? Number(storedSettings[key]) : s.defaultValue);
            s.slider.addEventListener('input', () => {
                setSetting(key, Number(s.slider.value));
                saveSettings();
            });
        });

        document.getElementById('reset-settings-btn').addEventListener('click', () => {
            Object.entries(SETTINGS).forEach(([key, s]) => setSetting(key, s.defaultValue));
            saveSettings();
        });

        // Build clean rows inside Dice Tray Manager Popup for D4, D6, D8, D12, D20
        const spawnerCountEls = {};
        Object.keys(DICE_TYPES).forEach(typeKey => {
            const cfg = DICE_TYPES[typeKey];
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between bg-slate-900/90 border border-white/10 rounded-xl px-3 py-1.5';

            row.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="text-xs font-extrabold ${cfg.badgeClass.split(' ')[0]} w-8">${typeKey}</span>
                    <span class="text-[11px] text-slate-400">${cfg.sides}-Sided Die</span>
                </div>
                <div class="flex items-center gap-2">
                    <button class="minus-btn w-7 h-7 rounded-lg bg-slate-800 hover:bg-red-950/80 text-slate-300 hover:text-red-300 border border-white/10 font-bold text-sm flex items-center justify-center active:scale-90 transition">−</button>
                    <span class="mono-num text-xs font-bold text-white w-5 text-center count-badge">0</span>
                    <button class="plus-btn w-7 h-7 rounded-lg bg-slate-800 hover:bg-emerald-950/80 text-emerald-300 border border-emerald-500/30 font-bold text-sm flex items-center justify-center active:scale-90 transition">+</button>
                </div>
            `;

            row.querySelector('.minus-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                removeOneDieByType(typeKey);

            row.querySelector('.plus-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                soundFX.playSpawn(true);
                addDie(typeKey, null, true);

            spawnerCountEls[typeKey] = row.querySelector('.count-badge');
            polySpawnerGroup.appendChild(row);
        });

        preset5d6Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundFX.playSpawn(true);
            resetToDefault5D6();
            applyRollToUnlockedDice(0.4, -0.3, 0.9);
            closeAllPopups();
        });

        presetRpgBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundFX.playSpawn(true);
            while (diceList.length > 0) {
                const d = diceList.pop();
                scene.remove(d.mesh);
                if (d.glowSprite.material) d.glowSprite.material.dispose();
                world.removeBody(d.body);
            }
            const types = ['D4', 'D6', 'D8', 'D12', 'D20'];
            const offsets = [[-2.0, -1.6], [2.0, -1.6], [0, 0], [-2.0, 1.6], [2.0, 1.6]];
            types.forEach((t, i) => addDie(t, offsets[i], true));
            rebuildHUDDiceList();
            closeAllPopups();
        });

        clearUnlockedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const toRemove = diceList.filter(d => !d.locked);
            toRemove.forEach(d => removeDie(d));
        });

        let dieChipsMap = new Map();

        function rebuildHUDDiceList() {
            readoutListEl.innerHTML = '';
            dieChipsMap.clear();

            const typeCounts = { D4: 0, D6: 0, D8: 0, D12: 0, D20: 0 };
            diceList.forEach(d => { typeCounts[d.type] = (typeCounts[d.type] || 0) + 1; });
            Object.keys(spawnerCountEls).forEach(k => {
                spawnerCountEls[k].textContent = typeCounts[k] || 0;
            });

            diceCountLabel.textContent = `${diceList.length} ${diceList.length === 1 ? 'Die' : 'Dice'}`;

            diceList.forEach((die) => {

                wrapper.title = `Tap to Lock/Unlock ${die.type}`;

                wrapper.innerHTML = `
                    <span class="text-[8px] font-extrabold uppercase tracking-tighter opacity-75">${die.type}</span>
                    <span class="val mono-num font-extrabold text-xs sm:text-sm text-white">1</span>
                `;

                    toggleDieLock(die);
                });

                readoutListEl.appendChild(wrapper);
                dieChipsMap.set(die.uid, wrapper);
            });

            updateHUDReadout();

        function updateHUDReadout() {
            let sum = 0;
            let lockedCount = 0;

            diceList.forEach((die) => {
                const val = getTopFaceValue(die);
                die.value = val;
                sum += val;
                if (die.locked) lockedCount++;

                const chip = dieChipsMap.get(die.uid);
                if (chip) {
                    chip.querySelector('.val').textContent = val;
                    if (die.locked) chip.classList.add('locked');
                    else chip.classList.remove('locked');
                }
            });

            totalSumEl.textContent = sum;
            unlockBtn.disabled = lockedCount === 0;
        }

        rollBtn.addEventListener('click', () => {

        /**************************************************************
         * 12. RESPONSIVE RESIZE & SAFETY BOUNDARY CLAMPING
         **************************************************************/
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeSwipeCanvas();
            updateBoxDimensions();

            diceList.forEach(die => {
                const r = die.cfg.radius;
                const maxX = boxHalfWidth - r * 0.65;
                const maxZ = boxHalfDepth - r * 0.65;
                die.body.position.x = THREE.MathUtils.clamp(die.body.position.x, -maxX, maxX);
                die.body.position.z = THREE.MathUtils.clamp(die.body.position.z, -maxZ, maxZ);
                if (die.locked) {
                    die.lockedPosition.copy(die.body.position);
                }
            });
        });

        /**************************************************************
         * 13. MAIN ANIMATION, 3D GRAVITY & PARALLAX LOOP
         **************************************************************/
        let lastFrameTime = performance.now();
        let hudRefreshCounter = 0;

        /**************************************************************
         * SETTLING: keep dice from coming to rest on an edge or corner
         **************************************************************/
        // A die counts as flat when one face normal is within this angle of the gravity direction.
        const FLAT_COS = Math.cos(THREE.MathUtils.degToRad(4));
        // Resting tilted more than this for COCKED_RESCUE_DELAY seconds counts as cocked.
        const COCKED_COS = Math.cos(THREE.MathUtils.degToRad(7));
        const COCKED_RESCUE_DELAY = 0.8;
        // Hops per die per roll, so a die wedged for good eventually stays put instead of hopping forever.
        const MAX_RESCUES = 3;
        // Angular acceleration (rad/s² per radian of tilt) that tips a slow, tilted die onto its nearest face.
        const SETTLE_GAIN = 16;

        const gravityDir = new THREE.Vector3(0, -1, 0);
        const restNormal = new THREE.Vector3();
        const settleAxis = new THREE.Vector3();

        /**
         * Finds the face that is closest to resting flat (its outward normal most aligned with gravity).
         * Writes that face's world-space normal to `restNormal` and returns the cosine of its tilt.
         */
        function restingFaceAlignment(die) {
            let bestDot = -Infinity;
            const normals = die.asset.faceNormals;
            for (let i = 0; i < normals.length; i++) {
                tempVec.copy(normals[i]).applyQuaternion(die.body.quaternion);
                const d = tempVec.dot(gravityDir);
                if (d > bestDot) {
                    bestDot = d;
                    restNormal.copy(tempVec);
                }
            }
            return bestDot;
        }

        function animate(now = performance.now()) {
            requestAnimationFrame(animate);

            const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            // Smoothly interpolate 3D gravity vector & update physics world
            prevSmoothTilt.nx = smoothTilt.nx;
            prevSmoothTilt.ny = smoothTilt.ny;
            prevSmoothTilt.nz = smoothTilt.nz;

            smoothTilt.nx += (targetTilt.nx - smoothTilt.nx) * 0.22;
            smoothTilt.ny += (targetTilt.ny - smoothTilt.ny) * 0.22;
            smoothTilt.nz += (targetTilt.nz - smoothTilt.nz) * 0.22;

            const gravityChangeRate = Math.hypot(
                smoothTilt.nx - prevSmoothTilt.nx,
                smoothTilt.ny - prevSmoothTilt.ny,
                smoothTilt.nz - prevSmoothTilt.nz
            );

            world.gravity.set(
                smoothTilt.nx * BASE_GRAVITY * 0.9,
                smoothTilt.ny * BASE_GRAVITY,
                smoothTilt.nz * BASE_GRAVITY * 0.9
            );

            // Off-axis camera & directional light parallax to enhance 3D glass-box depth
            camera.position.x = -smoothTilt.nx * 2.2;
            camera.position.z = -smoothTilt.nz * 2.2;
            camera.lookAt(smoothTilt.nx * 0.4, 0, smoothTilt.nz * 0.4);

            mainSpotLight.position.x = 4 - smoothTilt.nx * 5;
            mainSpotLight.position.z = 5 - smoothTilt.nz * 5;

            // Update interactive Gravity Pad indicator dot
            const dotX = smoothTilt.nx * 20;
            const dotY = smoothTilt.nz * 20;
            tiltDot.style.transform = `translate(${dotX.toFixed(1)}px, ${dotY.toFixed(1)}px)`;
            gravityReadout.textContent = `GX:${smoothTilt.nx.toFixed(1)} GZ:${smoothTilt.nz.toFixed(1)} GY:${smoothTilt.ny.toFixed(1)}`;

            // High-frequency 120Hz fixed physics substeps for rock-solid polyhedral settling
            world.step(1 / 120, dt, 10);

            const gravityLen = world.gravity.length();
            if (gravityLen > 1) {
                gravityDir.set(world.gravity.x, world.gravity.y, world.gravity.z).divideScalar(gravityLen);
            }
            // Bodies touching something after the last substep (sleeping dice have no contacts)
            const touchingBodies = new Set();
            for (const c of world.contacts) {
                touchingBodies.add(c.bi);
                touchingBodies.add(c.bj);
            }

            const pulseScale = 1 + Math.sin(now * 0.008) * 0.08;

            for (let i = 0; i < diceList.length; i++) {
                const die = diceList[i];
                const r = die.cfg.radius * 0.62;
                const maxX = boxHalfWidth - r;
                const maxZ = boxHalfDepth - r;

                if (die.locked) {
                    die.body.position.copy(die.lockedPosition);
                    die.body.quaternion.copy(die.lockedQuaternion);
                    die.body.velocity.setZero();
                    die.body.angularVelocity.setZero();

                    const baseDiam = die.cfg.radius * 3.1;
                    die.glowSprite.scale.set(
                        baseDiam * pulseScale,
                        baseDiam * pulseScale,
                        1
                    );
                } else {
                    const body = die.body;
                    const speedSq = body.velocity.lengthSquared();
                    const angSpeedSq = body.angularVelocity.lengthSquared();
                    const slow = speedSq < 1.2 && angSpeedSq < 4.0;
                    const touching = touchingBodies.has(body);
                    const restCos = restingFaceAlignment(die);

                    // Tilting the phone is a fresh "roll" too (button/swipe rolls reset this in applyRollToUnlockedDice)
                    if (gravityChangeRate > 0.02) die.rescues = 0;

                    if (slow && touching && restCos > FLAT_COS) {
                        // Already flat: extra damping so sharp D4/D8 vertices rest cleanly without micro-jitter.
                        // Only applied once flat, so it can no longer freeze a die that is still tipping over.
                        if (gravityChangeRate < 0.004) {
                            body.angularVelocity.scale(0.82, body.angularVelocity);
                            body.velocity.scale(0.88, body.velocity);
                        }
                    } else if (slow && touching && die.rescues < MAX_RESCUES) {
                        // Slow but tilted: rotate the nearest face toward gravity so the die tips onto it
                        // instead of balancing on an edge. Axis n × g turns n toward g.
                        // Once the rescue hops are used up the die is wedged for good: stop pushing so it can sleep.
                        const tilt = Math.acos(THREE.MathUtils.clamp(restCos, -1, 1));
                        settleAxis.crossVectors(restNormal, gravityDir);
                        if (settleAxis.lengthSq() > 1e-8) {
                            settleAxis.normalize().multiplyScalar(SETTLE_GAIN * tilt * dt);
                            body.angularVelocity.x += settleAxis.x;
                            body.angularVelocity.y += settleAxis.y;
                            body.angularVelocity.z += settleAxis.z;
                        }
                    }

                    // Cocked-die rescue: still tilted after coming to rest (propped on a die or wall) → small hop
                    if (slow && restCos < COCKED_COS) {
                        die.cockedTime += dt;
                    } else {
                        die.cockedTime = 0;
                    }
                    if (die.cockedTime > COCKED_RESCUE_DELAY && die.rescues < MAX_RESCUES) {
                        die.cockedTime = 0;
                        die.rescues++;
                        body.wakeUp();
                        // Hop away from the nearest die (usually the one it is propped on), into open space
                        let awayX = Math.random() - 0.5;
                        let awayZ = Math.random() - 0.5;
                        let nearestSq = Infinity;
                        for (const other of diceList) {
                            if (other === die) continue;
                            const dx = body.position.x - other.body.position.x;
                            const dz = body.position.z - other.body.position.z;
                            const distSq = dx * dx + dz * dz;
                            if (distSq < nearestSq) {
                                nearestSq = distSq;
                                awayX = dx;
                                awayZ = dz;
                            }
                        }
                        const awayLen = Math.hypot(awayX, awayZ) || 1;
                        body.velocity.set(
                            -gravityDir.x * 5 + (awayX / awayLen) * 3 + (Math.random() - 0.5) * 2,
                            -gravityDir.y * 5,
                            -gravityDir.z * 5 + (awayZ / awayLen) * 3 + (Math.random() - 0.5) * 2
                        );
                        body.angularVelocity.set(
                            (Math.random() - 0.5) * 10,
                            (Math.random() - 0.5) * 10,
                            (Math.random() - 0.5) * 10
                        );
                    }

                    // Soft wall safety clamp without fighting floor/ceiling resting height
                    if (die.body.position.x < -maxX) { die.body.position.x = -maxX; if (die.body.velocity.x < 0) die.body.velocity.x *= -0.35; }
                    if (die.body.position.x > maxX)  { die.body.position.x = maxX;  if (die.body.velocity.x > 0) die.body.velocity.x *= -0.35; }
                    if (die.body.position.z < -maxZ) { die.body.position.z = -maxZ; if (die.body.velocity.z < 0) die.body.velocity.z *= -0.35; }
                    if (die.body.position.z > maxZ)  { die.body.position.z = maxZ;  if (die.body.velocity.z > 0) die.body.velocity.z *= -0.35; }

                    // Only catch extreme out-of-bounds tunnel escapes (never push resting D4 upward!)
                    if (die.body.position.y < -0.5) {
                        die.body.position.y = 0.5;
                        die.body.velocity.y = 0;
                    } else if (die.body.position.y > BOX_HEIGHT + 0.5) {
                        die.body.position.y = BOX_HEIGHT - 0.5;
                        if (die.body.velocity.y > 0) die.body.velocity.y = 0;
                    }
                }

                die.mesh.position.copy(die.body.position);
                die.mesh.quaternion.copy(die.body.quaternion);
            }

            hudRefreshCounter++;
            if (hudRefreshCounter % 6 === 0) {
                updateHUDReadout();
            }

            renderSwipeTrail();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            resetToDefault5D6();
            setTimeout(() => {
                applyRollToUnlockedDice(0.4, -0.3, 0.85);
            }, 150);
            animate();
        };
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
