# Server block for the dice box. Works both inside the dice-box container (Dockerfile) and pasted
# into an existing nginx: then change `root` to wherever the site/ folder is mounted.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tilt needs the motion sensors. 'self' is the browser default for a top-level page; stating it
    # keeps a stricter policy set further up the proxy chain from switching them off.
    add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the page, the manifest and the service worker so updates reach clients.
    location ~* (^/$|\.html$|\.webmanifest$|/sw\.js$) {
        types { text/html html; application/manifest+json webmanifest; application/javascript js; }
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
